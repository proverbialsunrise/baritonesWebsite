# Nginx reverse proxy configuration for Bearded Baritones
# Install on the DigitalOcean droplet at:
#   /etc/nginx/sites-available/beardedbaritones.com
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/beardedbaritones.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Add HTTPS + automatic renewal with Certbot:
#   sudo certbot --nginx -d beardedbaritones.com -d www.beardedbaritones.com

server {
    listen 80;
    listen [::]:80;
    server_name beardedbaritones.com www.beardedbaritones.com;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:4952;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
